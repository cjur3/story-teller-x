<form class="storyteller-importer" autocomplete="off" onsubmit="event.preventDefault();">
    <p class="notes">{{localize "STORYTELLER.ImporterHint"}}</p>
    <div class="form-group">
        <label>Upload File (.txt, .epub)</label>
        <div class="form-fields">
            <input type="file" name="file" accept=".txt,.epub" />
        </div>
    </div>
    <div class="form-group">
        <label>{{localize "STORYTELLER.ImporterImages"}}</label>
        <div class="form-fields">
            <input type="checkbox" name="images" checked />
        </div>
        <p class="hint">{{localize "STORYTELLER.ImporterImagesHint"}}</p>
    </div>
    <div class="form-group">
        <label>{{localize "STORYTELLER.Option.fontFamily"}}</label>
        <div class="form-fields">{{{fontSelect}}}</div>
        <p class="hint">{{localize "STORYTELLER.Option.fontFamilyHint"}}</p>
    </div>
    <div class="form-group">
        <label>{{localize "STORYTELLER.Importer.sheetType"}}</label>
        <div class="form-fields">
            <select name="sheetType">
                <option value="story" selected>{{localize "STORYTELLER.StoryEntry"}}</option>
                <option value="default">{{localize "STORYTELLER.Importer.sheetDefault"}}</option>
            </select>
        </div>
        <p class="hint">{{localize "STORYTELLER.Importer.sheetTypeHint"}}</p>
    </div>
    <div class="form-group st-story-only">
        <label>{{localize "STORYTELLER.Option.coverColor"}}</label>
        <div class="form-fields">{{{coverSelect}}}</div>
    </div>
    <div class="form-group st-story-only">
        <label>{{localize "STORYTELLER.Option.pageColor"}}</label>
        <div class="form-fields">{{{pageSelect}}}</div>
        <p class="hint">{{localize "STORYTELLER.Importer.pageColorHint"}}</p>
    </div>
    <div class="form-group">
        <label>{{localize "STORYTELLER.Option.fontColor"}}</label>
        <div class="form-fields">
            <input type="color" name="fontColor" value="{{fontColor}}">
            <label class="checkbox"><input type="checkbox" name="fontColorDefault" checked> {{localize "STORYTELLER.Importer.fontColorDefault"}}</label>
        </div>
    </div>
</form>
