<form class="storyteller-importer" autocomplete="off" onsubmit="event.preventDefault();">
    <p class="notes">{{localize "STORYTELLER.ImporterHint"}}</p>
    <div class="form-group">
        <label>Upload File (.txt, .epub)</label>
        <div class="form-fields">
            <input type="file" name="file" accept=".txt,.epub" />
        </div>
    </div>
</form>
