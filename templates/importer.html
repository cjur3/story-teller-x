<form class="storyteller-importer" autocomplete="off" onsubmit="event.preventDefault();">
    <p class="notes">{{localize "StoryTellerX.ImporterHint"}}</p>
    <div class="form-group">
        <label>Upload File (.txt, .epub)</label>
        <div class="form-fields">
            <input type="file" name="file" accept=".txt,.epub" />
        </div>
    </div>
    <div class="form-group">
        <label>{{localize "StoryTellerX.ImporterImages"}}</label>
        <div class="form-fields">
            <input type="checkbox" name="images" checked />
        </div>
        <p class="hint">{{localize "StoryTellerX.ImporterImagesHint"}}</p>
    </div>
    <div class="form-group">
        <label>{{localize "StoryTellerX.Option.fontFamily"}}</label>
        <div class="form-fields">{{{fontSelect}}}</div>
        <p class="hint">{{localize "StoryTellerX.Option.fontFamilyHint"}}</p>
    </div>
    <div class="form-group">
        <label>{{localize "StoryTellerX.Importer.sheetType"}}</label>
        <div class="form-fields">
            <select name="sheetType">
                <option value="story" selected>{{localize "StoryTellerX.StoryEntry"}}</option>
                <option value="default">{{localize "StoryTellerX.Importer.sheetDefault"}}</option>
            </select>
        </div>
        <p class="hint">{{localize "StoryTellerX.Importer.sheetTypeHint"}}</p>
    </div>
    <div class="form-group st-story-only">
        <label>{{localize "StoryTellerX.Option.coverColor"}}</label>
        <div class="form-fields">{{{coverSelect}}}</div>
    </div>
    <div class="form-group st-story-only">
        <label>{{localize "StoryTellerX.Option.pageColor"}}</label>
        <div class="form-fields">{{{pageSelect}}}</div>
        <p class="hint">{{localize "StoryTellerX.Importer.pageColorHint"}}</p>
    </div>
    <div class="form-group">
        <label>{{localize "StoryTellerX.Option.fontColor"}}</label>
        <div class="form-fields">
            <input type="color" name="fontColor" value="{{fontColor}}">
            <label class="checkbox"><input type="checkbox" name="fontColorDefault" checked> {{localize "StoryTellerX.Importer.fontColorDefault"}}</label>
        </div>
    </div>
</form>
