<div class="storyteller-loading-screen">
  <h1>{{document.name}}</h1>
  <div class="st-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="st-progress-bar"></div>
  </div>
  <div class="st-progress-text">0%</div>
</div>
<div class="journal-sheet-container {{cssClass}}">
  <div class="journal-entry-pages">
    <div id="story-{{data._id}}" class="scrollable pages">
      <div class="page-num num-start">
        <div class="journal-entry-page pages-content">
          <div class="content-inner">
            <form class="journal-header">
              <input
                class="title"
                name="name"
                type="text"
                value="{{document.name}}"
                placeholder="{{localize
              'JOURNAL.EntryTitle'}}"
              />
            </form>

            {{! Sidebar Pages Navigation }}
            <nav
              class="pages-list"
              aria-label="{{localize 'JOURNAL.NavLabel'}}"
              data-tooltip-direction="RIGHT"
            >
              <ol class="directory-list scrollable">
                {{#each toc as |page|}}
                <li
                  class="directory-item {{page.cssClass}}"
                  data-page-id="{{page._id}}"
                >
                  <div class="page-heading">
                    <span class="page-title">{{page.name}}</span>
                    {{#if page.icon}}
                    <span class="page-ownership {{page.ownershipCls}}"
                      ><i class="{{page.icon}}"></i
                    ></span>
                    {{/if}}
                    {{#if page.editable}}
                    <a class="st-chapter-config" title="{{localize 'StoryTellerX.Chapter.button'}}"><i class="fa-solid fa-gear"></i></a>
                    {{/if}}
                  </div>
                </li>
                {{/each}}
              </ol>
            </nav>
            {{#if editable}}
            <button class="create" type="button" data-action="createPage">
              <i class="fa-solid fa-file-circle-plus"></i> {{localize
              "StoryTellerX.AddChapter"}}
            </button>
            {{/if}}
          </div>
        </div>
        <div
          class="journal-page-arrow-left storyteller2-page-entry-nav prev"
        ></div>
        <div
          class="journal-page-arrow-right storyteller2-page-entry-nav next"
        ></div>
      </div>
      {{#each toc as |page|}}
      <div class="page-num {{page.number}}">
        <article
          class="journal-entry-page {{page.type}}"
          data-page-id="{{page._id}}"
          data-entry-index="{{page.number}}"
        >
          <a class="back-to-toc" title="{{localize 'StoryTellerX.BackToTOC'}}"><i class="fas fa-book-open"></i></a>
        </article>
        <div class="st-folio">{{offset page.number}}</div>
        <div
          class="journal-page-arrow-left storyteller2-page-entry-nav prev"
        ></div>
        <div
          class="journal-page-arrow-right storyteller2-page-entry-nav next"
        ></div>
      </div>
      {{/each}}
    </div>
  </div>
</div>
