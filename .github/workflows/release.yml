name: Automated Release Packer

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'module.json'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches history for correct changelog generation and tag checks

      - name: Get Version from module.json
        id: get_version
        run: |
          if [ ! -f "module.json" ]; then
            echo "❌ FEHLER: Keine module.json im Ziel-Repository gefunden!"
            exit 1
          fi
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Gefundene Version im Modul: $VERSION"

      - name: Check if Tag exists
        id: check_tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if git show-ref --tags --verify --quiet "refs/tags/$VERSION"; then
            echo "⚠️ Tag '$VERSION' existiert bereits. Überspringe Release."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Version ist komplett neu. Release wird vorbereitet."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Zip Module Git Files
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          zip -r module.zip . -x ".git/*" ".github/*"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          files: |
            module.json
            module.zip
