name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: CHANGELOG.md must be updated
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          git fetch origin "${{ github.base_ref }}"
          if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "::error::Add an entry to CHANGELOG.md under [Unreleased] (or use the skip-changelog label)."; exit 1
          fi

  important:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git fetch origin "${{ github.base_ref }}"
      - run: node scripts/ci/check-important.mjs "origin/${{ github.base_ref }}"

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git fetch origin "${{ github.base_ref }}"
      - run: node scripts/ci/check-licenses.mjs "origin/${{ github.base_ref }}"
